<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Tea Transaction Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h2 {
            margin-bottom: 1.5rem;
            color: #2d3a4b;
            font-weight: 700;
            letter-spacing: 1px;
        }
        label {
            font-size: 1.05em;
            color: #4a5a6a;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1.5px solid #dbeafe;
            border-radius: 8px;
            font-size: 1em;
            background: #f8fafc;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border: 1.5px solid #60a5fa;
            outline: none;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(90deg, #60a5fa 0%, #2563eb 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(96, 165, 250, 0.08);
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
            transform: translateY(-2px) scale(1.01);
        }
        #result {
            margin-top: 28px;
            font-weight: 500;
            min-height: 40px;
        }
        #progress-bar {
            width: 100%;
            background: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            height: 26px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(96, 165, 250, 0.10);
        }
        #progress-fill {
            background: linear-gradient(90deg, #60a5fa 0%, #2563eb 100%);
            height: 100%;
            width: 0%;
            border-radius: 12px 0 0 12px;
            transition: width 0.3s cubic-bezier(.4,2.5,.5,1);
            box-shadow: 0 2px 8px rgba(96, 165, 250, 0.12);
        }
        #progress-text {
            margin-top: 6px;
            color: #2563eb;
            font-size: 1.05em;
            letter-spacing: 0.5px;
            font-weight: 500;
            min-height: 24px;
        }
        @media (max-width: 500px) {
            .container {
                padding: 1.2rem 0.5rem 1.5rem 0.5rem;
            }
            h2 {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Daily Tea Transaction Scanner</h2>
        <form id="scanForm" autocomplete="off">
            <label for="wallet_address">Wallet Address</label><br>
            <input type="text" id="wallet_address" name="wallet_address" placeholder="0x..." required><br>
            <button type="submit">Scan</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        document.getElementById('scanForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const wallet = document.getElementById('wallet_address').value.trim();
            document.getElementById('result').innerHTML = `
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <div id="progress-text">Starting scan...</div>
            `;

            const evtSource = new EventSource(`/scan-progress?wallet_address=${encodeURIComponent(wallet)}`);
            evtSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.error) {
                    document.getElementById('result').innerHTML = `<span style="color:#dc2626;">Error: ${data.error}</span>`;
                    evtSource.close();
                } else if (data.done) {
                    document.getElementById('result').innerHTML = `
                        <div style="color:#059669;font-size:1.15em;">
                            <span style="font-size:1.5em;">&#9989;</span> 
                            Total transactions today: <b>${data.total_transactions}</b>
                        </div>
                    `;
                    evtSource.close();
                } else {
                    document.getElementById('progress-fill').style.width = data.percent + "%";
                    document.getElementById('progress-text').textContent =
                        `Scanning:(${data.percent}%). ETA: ${Math.ceil(data.eta)}s`;
                }
            };
        });
    </script>
</body>
</html>
